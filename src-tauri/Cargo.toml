[package]
name = "desktop-gadget"
version = "1.0.0"
description = "Desktop gadget (frosted glass cards)"
edition = "2021"

[lib]
name = "desktop_gadget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# フェーズ5：設定の書き出し・読み込みのファイル選択
tauri-plugin-dialog = "2"
# 二重起動を防ぐ（2回目に起動したら、設定画面を開く）
tauri-plugin-single-instance = "2"
window-vibrancy = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# フェーズ4：天気・警報・レーダーの取得（WindowsではOSの暗号化通信 schannel を使う）
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# フェーズ3：使用量（PDH・DXGI・メモリ）と動作状態（電源・全画面・ロック）。Tauriが使う版にそろえる
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Wdk_Graphics_Direct3D",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
] }
