[package]
name = "desktop-gadget"
version = "0.1.0"
description = "Desktop gadget (frosted glass cards)"
edition = "2021"

[lib]
name = "desktop_gadget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
window-vibrancy = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
